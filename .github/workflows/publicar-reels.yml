name: Publicar Reels Instagram e Facebook

on:
  schedule:
    # Horários em UTC, equivalentes aos dez slots da fila em Brasília.
    # Cada slot tem uma segunda tentativa 15 minutos depois.
    - cron: "0 9 * * *"
    - cron: "15 9 * * *"
    - cron: "0 11 * * *"
    - cron: "15 11 * * *"
    - cron: "0 13 * * *"
    - cron: "15 13 * * *"
    - cron: "0 15 * * *"
    - cron: "15 15 * * *"
    - cron: "0 17 * * *"
    - cron: "15 17 * * *"
    - cron: "0 19 * * *"
    - cron: "15 19 * * *"
    - cron: "0 21 * * *"
    - cron: "15 21 * * *"
    - cron: "0 22 * * *"
    - cron: "15 22 * * *"
    - cron: "0 0 * * *"
    - cron: "15 0 * * *"
    - cron: "0 1 * * *"
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      data_publicacao:
        description: "Data exata do Reel (AAAA-MM-DD)"
        required: true
        type: string
      permitir_data_futura:
        description: "Deixa o disparo manual usar uma data futura (queima aquele dia)"
        required: false
        default: "NAO"
        type: choice
        options:
          - "NAO"
          - "SIM"
      horario_publicacao:
        description: "Horário exato, um dos dez da escada"
        required: true
        type: choice
        options:
          - "19:00"
          - "12:00"
          - "21:00"
          - "08:00"
          - "16:00"
          - "06:00"
          - "18:00"
          - "10:00"
          - "22:00"
          - "14:00"
      confirmar_publicacao:
        description: "Confirma que esta execução manual pode publicar de verdade"
        required: true
        default: "NAO_PUBLICAR"
        type: choice
        options:
          - "NAO_PUBLICAR"
          - "PUBLICAR"

concurrency:
  group: publicacao-meta-pilula-diaria
  queue: max
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ vars.PUBLICACAO_ATIVA == 'true' && (github.event_name != 'workflow_dispatch' || inputs.confirmar_publicacao == 'PUBLICAR') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Recusar data futura em disparo manual
        # Um teste manual apontado para amanha publica o conteudo HOJE e ainda
        # marca aquele dia como feito. No dia certo nada sai e o canal fica mudo
        # sem ninguem perceber. Foi o que calou a Mente Decifrada em 12 e
        # 13/09/2026, depois dos testes de 11/09. Por padrao o disparo manual so
        # mexe no dia de hoje; para furar isso e preciso dizer SIM na mao.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          DATA_PEDIDA: ${{ inputs.data_publicacao }}
          PERMITIR_FUTURO: ${{ inputs.permitir_data_futura }}
        run: |
          hoje="$(TZ=America/Sao_Paulo date +%F)"
          if [ -n "$DATA_PEDIDA" ] && [ "$DATA_PEDIDA" \> "$hoje" ] && [ "$PERMITIR_FUTURO" != "SIM" ]; then
            echo "Recusado: $DATA_PEDIDA e uma data futura; hoje e $hoje." >&2
            echo "Publicar um slot futuro agora deixa aquele dia mudo." >&2
            echo "Se for mesmo o que voce quer, marque permitir_data_futura=SIM." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Busca a ponta atual somente depois de adquirir o lock de concorrência.
          # Isso evita que dois dispatches enfileirados usem o mesmo SHA antigo.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Definir slot exato
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          DATA_INPUT: ${{ inputs.data_publicacao }}
          HORA_INPUT: ${{ inputs.horario_publicacao }}
        run: |
          if [[ "$EVENTO" == "workflow_dispatch" ]]; then
            data="$DATA_INPUT"
            hora="$HORA_INPUT"
          else
            case "$CRON" in
              "0 9 * * *"|"15 9 * * *") data="$(date -u +%F)"; hora="06:00" ;;
              "0 11 * * *"|"15 11 * * *") data="$(date -u +%F)"; hora="08:00" ;;
              "0 13 * * *"|"15 13 * * *") data="$(date -u +%F)"; hora="10:00" ;;
              "0 15 * * *"|"15 15 * * *") data="$(date -u +%F)"; hora="12:00" ;;
              "0 17 * * *"|"15 17 * * *") data="$(date -u +%F)"; hora="14:00" ;;
              "0 19 * * *"|"15 19 * * *") data="$(date -u +%F)"; hora="16:00" ;;
              "0 21 * * *"|"15 21 * * *") data="$(date -u +%F)"; hora="18:00" ;;
              "0 22 * * *"|"15 22 * * *") data="$(date -u +%F)"; hora="19:00" ;;
              # 00:00 e 01:00 UTC ainda pertencem ao dia anterior em Brasília.
              # Derivar do cron mantém a data certa se o runner atrasar.
              "0 0 * * *"|"15 0 * * *") data="$(date -u -d 'yesterday' +%F)"; hora="21:00" ;;
              "0 1 * * *"|"15 1 * * *") data="$(date -u -d 'yesterday' +%F)"; hora="22:00" ;;
              *) echo "Cron não reconhecido: $CRON" >&2; exit 2 ;;
            esac
          fi
          echo "DATA_PUBLICACAO=$data" >> "$GITHUB_ENV"
          echo "HORARIO_PUBLICACAO=$hora" >> "$GITHUB_ENV"
      - name: Validar filas
        run: python validar_filas.py
      - name: Publicar Reel do slot
        id: publicar_reel
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG || 'fila-instagram-facebook' }}
          PERSISTIR_ESTADO_REMOTO: "true"
          MEDIA_CACHE_DIR: ${{ runner.temp }}/midias
        run: python publicar_reels.py
      - name: Persistir estado da publicação
        id: salvar_estado_publicacao
        if: ${{ always() && steps.publicar_reel.outcome != 'skipped' }}
        shell: bash
        run: |
          python meta_comum.py persistir-git \
            --fila fila/fila-reels.json \
            --mensagem "chore: registrar Reel $DATA_PUBLICACAO $HORARIO_PUBLICACAO"
      - name: Remover mídia temporária confirmada
        id: limpar_release
        if: ${{ always() && steps.salvar_estado_publicacao.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG || 'fila-instagram-facebook' }}
          PERSISTIR_ESTADO_REMOTO: "true"
        run: python limpar_release.py --fila fila/fila-reels.json
      - name: Persistir marcadores da limpeza
        id: salvar_marcadores_limpeza
        if: ${{ always() && steps.salvar_estado_publicacao.outcome == 'success' && steps.limpar_release.outcome != 'skipped' }}
        shell: bash
        run: |
          python meta_comum.py persistir-git \
            --fila fila/fila-reels.json \
            --mensagem "chore: registrar limpeza do Reel $DATA_PUBLICACAO $HORARIO_PUBLICACAO"
      - name: Propagar falhas após preservar o estado
        if: always()
        shell: bash
        env:
          RESULTADO_PUBLICACAO: ${{ steps.publicar_reel.outcome }}
          RESULTADO_ESTADO: ${{ steps.salvar_estado_publicacao.outcome }}
          RESULTADO_LIMPEZA: ${{ steps.limpar_release.outcome }}
          RESULTADO_MARCADORES: ${{ steps.salvar_marcadores_limpeza.outcome }}
        run: |
          [[ "$RESULTADO_PUBLICACAO" == "success" \
            && "$RESULTADO_ESTADO" == "success" \
            && "$RESULTADO_LIMPEZA" == "success" \
            && "$RESULTADO_MARCADORES" == "success" ]]
